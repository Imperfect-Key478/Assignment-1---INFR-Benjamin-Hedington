<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benjamin's Portfolio - Contact Me</title>
    <link rel="stylesheet" href="laptopviewport.css">
    <link rel="stylesheet" href="mobileviewport.css">
    <link rel="stylesheet" href="tabletviewport.css">
</head>
<body>
    <header>
        <h1>Contact Me</h1>
        <nav>
            <a href="index.html">Home Page</a>
            <a href="aboutme.html">About Me</a>
            <a href="projects.html">Projects</a>
            <a href="contactme.html">Contact Me</a>
        </nav>
    </header>
    <main>
        <section>
            <!-- Form section for contact me -->
            <form>
                <label for="name">Name:</label>
                <!-- These single breaks just put input boxes below the title text -->
                <br>
                <!-- Gets basic type text with placeholder -->
                <input type="text" id="name" name="name" placeholder="..." required>
                <!-- Double breaks break up the text and boxes -->
                <br><br>
                <label for="email">Email:</label>
                <br>
                <!-- Gets basic type email searching for valid email format and placeholder -->
                <input type="email" id="email" name="email" placeholder="..." required>
                <br><br>
                <label for="phone">Phone:</label>
                <br>
                <!-- Gets basic type tel searching for valid phone format and placeholder -->
                <input type="tel" id="phone" name="phone" placeholder="..." required>
                <br><br>
                <label for="comments">Comments:</label>
                <br>
                <!-- Unrequired textarea with placeholder -->
                <textarea id="comments" name="comments" placeholder="..." rows="6"></textarea>
                <br><br>
                <!-- Submits and resets form -->
                <input type="submit" value="Submit">
            </form>
        </section>
    </main>
    <footer>
        <p>Email: benhedington@gmail.com</p>
        <p>&copy; 2026 Benjamin's Portfolio. All rights reserved.</p>
    </footer>
</body>
</html>
